[project]
name = "aepml"
version = "0.1.0"
description = "Power Path outage-risk models for the AEP Outage Concierge (Model A and the A-to-home risk derivation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pyarrow>=14",
]

[project.scripts]
aepml-train-a = "aepml.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aepml"]
