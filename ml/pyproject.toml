[project]
name = "aep-outage-ml"
version = "0.1.0"
description = "Feature engineering and models (A link-damage, B damage-counts, C access) for the AEP Outage Concierge, read from and written to S3."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "boto3>=1.34",
    "s3fs>=2024.6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "joblib>=1.3",
]

[tool.uv]
package = false
