[project]
name = "aep-outage-backend"
version = "0.1.0"
description = "FastAPI backend serving the cleaned AEP outage data from S3 (processed parquet batches)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=16",
    "boto3>=1.34",
    "s3fs>=2024.6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[tool.uv]
package = false
